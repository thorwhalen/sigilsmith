# CI: typecheck, build and test on every push and PR. Publish to npm with trusted
# publishing (OIDC, no token) when a push to main has `[publish-npm]` in its subject.
# The npm trusted publisher for `sigilsmith` points at this file: keep its name.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-npm]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: https://registry.npmjs.org, cache: npm }
      - name: Ensure npm >= 11.5.1 (required for OIDC trusted publishing)
        run: |
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
      - run: npm ci
      - name: Skip when this version is already on npm
        id: v
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "sigilsmith@$v" version >/dev/null 2>&1; then echo "::warning::sigilsmith@$v already published"; echo skip=1 >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.skip != '1'
        run: npm publish --provenance --access public
